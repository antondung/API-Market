name: Kiem tra tu dong

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phat-hien:
    name: Phat hien cong nghe
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
      java_maven: ${{ steps.detect.outputs.java_maven }}
      java_gradle: ${{ steps.detect.outputs.java_gradle }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      go: ${{ steps.detect.outputs.go }}
      rust: ${{ steps.detect.outputs.rust }}
      php: ${{ steps.detect.outputs.php }}
      ruby: ${{ steps.detect.outputs.ruby }}
      cmake: ${{ steps.detect.outputs.cmake }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        name: Quet tep cau hinh
        shell: bash
        run: |
          detect() { find . -type f -not -path './.git/*' \( $2 \) -print -quit | grep -q . && echo "$1=true" >> "$GITHUB_OUTPUT" || echo "$1=false" >> "$GITHUB_OUTPUT"; }
          detect node "-name package.json"
          detect python "-name pyproject.toml -o -name requirements.txt -o -name setup.py -o -name setup.cfg"
          detect java_maven "-name pom.xml"
          detect java_gradle "-name build.gradle -o -name build.gradle.kts"
          detect dotnet "-name '*.sln' -o -name '*.csproj' -o -name '*.fsproj'"
          detect go "-name go.mod"
          detect rust "-name Cargo.toml"
          detect php "-name composer.json"
          detect ruby "-name Gemfile"
          detect cmake "-name CMakeLists.txt"

  nen-tang:
    name: Kiem tra kho ma nguon
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - shell: pwsh
        run: ./scripts/kiem-tra-kho-ma-nguon.ps1

  node:
    name: Node.js
    needs: phat-hien
    if: needs.phat-hien.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  api-e2e:
    name: API E2E Sprint 2
    needs: phat-hien
    if: needs.phat-hien.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AUTH_STORE: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/api_market_test
      JWT_SECRET: ci-only-secret-for-api-e2e-not-used-anywhere-else
      PORT: 3000
      HOST: 127.0.0.1
      DNS_SERVERS: 127.0.0.1:15353
      NXDOMAIN_FIXTURE_IP: 127.0.0.1
      API_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tao schema va du lieu seed
        run: node --import tsx backend/src/database-cli.ts --seed
      - name: Khoi dong backend
        run: |
          node --import tsx backend/src/server.ts > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Chay bo test API E2E
        run: node qa-scripts/sprint2-backend-runner.js
      - name: Luu ket qua
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-api-e2e-results
          path: |
            qa-scripts/sprint2-backend-results.json
            backend.log
          if-no-files-found: ignore
  frontend:
    name: Frontend
    needs: phat-hien
    if: needs.phat-hien.outputs.node == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --no-file-parallelism
      - run: npm run build

  frontend-browser-e2e:
    name: Frontend Browser E2E Sprint 2
    needs: [phat-hien, frontend]
    if: needs.phat-hien.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AUTH_STORE: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/api_market_test
      JWT_SECRET: ci-only-secret-for-browser-e2e-not-used-anywhere-else
      PORT: 3000
      HOST: 127.0.0.1
      API_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:5173
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cai dat dependencies root
        run: npm ci
      - name: Cai dat dependencies frontend va build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Cai dat dependencies qa-scripts va Playwright browser
        run: |
          cd qa-scripts
          npm ci
          npx playwright install --with-deps chromium
      - name: Tao schema va du lieu seed
        run: node --import tsx backend/src/database-cli.ts --seed
      - name: Khoi dong backend
        run: |
          node --import tsx backend/src/server.ts > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Khoi dong Vite preview frontend
        run: |
          cd frontend
          npx vite preview --port 5173 --host 127.0.0.1 > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then exit 0; fi
            sleep 2
          done
          cat ../frontend.log
          exit 1
      - name: Chay bo test Browser E2E
        run: node qa-scripts/sprint2-ui-e2e-runner.cjs
      - name: Luu ket qua va anh chup man hinh
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-browser-e2e-evidence
          path: |
            qa-scripts/sprint2-ui-e2e-results.json
            qa-scripts/screenshots/
            backend.log
            frontend.log
          if-no-files-found: ignore

  python:
    name: Python
    needs: phat-hien
    if: needs.phat-hien.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Cai dat va kiem tra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f pyproject.toml ] || [ -f setup.py ]; then pip install .; fi
          if [ -d tests ]; then python -m unittest discover -v; fi

  java-maven:
    name: Java Maven
    needs: phat-hien
    if: needs.phat-hien.outputs.java_maven == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  java-gradle:
    name: Java Gradle
    needs: phat-hien
    if: needs.phat-hien.outputs.java_gradle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build

  dotnet:
    name: .NET
    needs: phat-hien
    if: needs.phat-hien.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  go:
    name: Go
    needs: phat-hien
    if: needs.phat-hien.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go vet ./...
      - run: go test ./...

  rust:
    name: Rust
    needs: phat-hien
    if: needs.phat-hien.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  php:
    name: PHP
    needs: phat-hien
    if: needs.phat-hien.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer test --if-present

  ruby:
    name: Ruby
    needs: phat-hien
    if: needs.phat-hien.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake

  cpp:
    name: C va C++
    needs: phat-hien
    if: needs.phat-hien.outputs.cmake == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build --output-on-failure

  ket-qua:
    name: Kiem tra nen tang
    if: always()
    needs: [phat-hien, nen-tang, node, frontend, api-e2e, frontend-browser-e2e, python, java-maven, java-gradle, dotnet, go, rust, php, ruby, cpp]
    runs-on: ubuntu-latest
    steps:
      - name: Tong hop ket qua
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo 'Có kiểm tra thất bại hoặc bị hủy.'
            exit 1
          fi
