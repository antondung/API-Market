# Requires Docker Compose >=2.24.4 for !override / !reset.
# Supply TLS/reverse proxy outside this stack. Only loopback ports are published.
services:
  backend:
    environment:
      NODE_ENV: production
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
  weather:
    ports: !reset []
  currency:
    ports: !reset []
  catalog:
    ports: !reset []
