# Cấu hình nginx cho SPA React.
# Mọi route không khớp file tĩnh đều trả index.html để React Router xử lý,
# tránh 404 khi người dùng tải lại trang ở route con như /marketplace hoặc /admin/users.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén để giảm dung lượng truyền
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Không lộ phiên bản nginx
    server_tokens off;

    # Header bảo mật cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Asset có hash trong tên nên cache dài hạn
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html không cache để bản mới được nhận ngay sau khi deploy
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}